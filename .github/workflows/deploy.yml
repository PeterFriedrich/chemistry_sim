name: Deploy site

# Builds site/ into _site/ (cache-busted) and publishes it to GitHub Pages on every push to main. The unit tests run
# again here: this gates the PUBLISH, tests.yml gates the CHANGE.
# One-time setup: Settings → Pages → Source: GitHub Actions (docs/ARCHITECTURE.md §6).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run tests
        run: node --test tests/*.test.js

      # Stamps every .js/.css URL with ?v=<content hash> (docs/ARCHITECTURE.md §6),
      # so browsers never mix a fresh page with a cached old module.
      - name: Build site
        run: node tools/build-site.js --out _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
